# Receta del proyecto para XcodeGen.
# En la nube, XcodeGen lee este archivo y genera AppTDAH.xcodeproj
# (el proyecto de Xcode), que por eso NO se sube al repositorio.

name: AppTDAH

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AppTDAH:
    type: application
    platform: iOS
    sources: [AppTDAH, Compartido]
    dependencies:
      # Los widgets viajan adentro de la app (PlugIns/AppTDAHWidgets.appex).
      - target: AppTDAHWidgets
    # La carpeta compartida con los widgets. SideStore la registra con tu Apple ID al instalar.
    entitlements:
      path: Soporte/AppTDAH.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tdah.AppTDAH]
    # Se genera en la nube; solo agrega lo que no se puede poner como INFOPLIST_KEY.
    info:
      path: Soporte/Info.plist
      properties:
        NSAlarmKitUsageDescription: "Para que el comienzo y el fin de cada tarea suenen como un despertador, aunque el iPhone esté en silencio."
        NSMicrophoneUsageDescription: "Para que puedas dictar lo que tenés en la cabeza."
        NSSpeechRecognitionUsageDescription: "Para pasar a texto lo que dictás."
        NSCalendarsFullAccessUsageDescription: "Para poner tus tareas y citas en tu calendario y no proponerte horas que ya tenés ocupadas."
        NSLocationWhenInUseUsageDescription: "Para calcular cuándo salir hacia una cita desde donde estás y sugerirte lugares cerca."
        # Los widgets abren la app con apptdah://dictar, apptdah://escribir o apptdah://inicio.
        CFBundleURLTypes:
          - CFBundleURLName: app.tdah.AppTDAH
            CFBundleURLSchemes: [apptdah]
        # SideStore anota acá el nombre real de la carpeta compartida.
        ALTAppGroups: [group.app.tdah.AppTDAH]
    settings:
      base:
        # SideStore reemplaza este identificador al instalar con tu Apple ID.
        PRODUCT_BUNDLE_IDENTIFIER: app.tdah.AppTDAH
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppTDAH
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # La copia de seguridad se ve en la app Archivos (En mi iPhone -> AppTDAH).
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"

  AppTDAHWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AppTDAHWidgets
      - Compartido
      - path: AppTDAH/Fuentes
        buildPhase: resources
    info:
      path: Soporte/Widgets-Info.plist
      properties:
        CFBundleDisplayName: AppTDAH
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Fraunces.ttf, Fraunces-Italic.ttf]
        ALTAppGroups: [group.app.tdah.AppTDAH]
    entitlements:
      path: Soporte/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tdah.AppTDAH]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tdah.AppTDAH.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AppTDAH
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  AppTDAHTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTDAHTests]
    dependencies:
      - target: AppTDAH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tdah.AppTDAHTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AppTDAH:
    build:
      targets:
        AppTDAH: all
    test:
      targets:
        - AppTDAHTests
